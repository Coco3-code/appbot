name: Build iPhone 8 vision
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: vision-iphone8
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Compiler (sans signature)
        run: |
          xcodebuild -project YoloBLE.xcodeproj -scheme YoloBLE \
            -sdk iphoneos -configuration Release -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Creer l'IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/YoloBLE.app Payload/
          zip -r YoloBLE.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: vision-iphone8-ipa
          path: vision-iphone8/YoloBLE.ipa
