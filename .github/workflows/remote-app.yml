name: Build telecommande (iOS + Android)
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generer le projet Flutter
        run: |
          cd remote-app
          flutter create --project-name robot_remote --org com.example app
          cp src/main.dart app/lib/main.dart
          cp src/pubspec.yaml app/pubspec.yaml
          cd app
          bash ../tools/patch_platforms.sh
          flutter pub get
      - name: APK Android
        run: cd remote-app/app && flutter build apk --release
      - name: IPA iOS (sans signature)
        run: |
          cd remote-app/app
          flutter build ios --release --no-codesign
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r RobotRemote.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: remote-android-apk
          path: remote-app/app/build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: remote-ios-ipa
          path: remote-app/app/RobotRemote.ipa
